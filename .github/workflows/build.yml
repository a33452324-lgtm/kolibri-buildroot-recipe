name: Build Kolibri-Hacker OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git wget cpio unzip rsync bc libncurses-dev libssl-dev

    - name: Download and Extract Buildroot
      run: |
        wget https://buildroot.org/downloads/buildroot-2024.02.1.tar.gz
        tar -xzf buildroot-2024.02.1.tar.gz

    - name: Apply Config and Build
      run: |
        cp configs/kolibri_hacker_defconfig buildroot-2024.02.1/configs/
        cd buildroot-2024.02.1
        make kolibri_hacker_defconfig
        make -j$(nproc)

    - name: Upload OS Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kolibri-hacker-os-image
        path: buildroot-2024.02.1/output/images/
